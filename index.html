    <style id="themeStylesheet">
        :root {
            --bg-color: #02040a;
            --panel-bg: #0b0f19;
            --text-color: #f8fafc;
            --card-text: #050401;
            --stat-box-border: #946f02;
            --stat-panel-bg: rgba(30, 20, 1, 0.75);
            /* Dynamic neon border colors */
            --neon-start: #00f0ff;
            --neon-mid: #0066ff;
            --neon-end: #00f0ff;
        }

        body {
            font-family: "Arial Black", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* --- THE EVEN SHIELD MULTI-CARD WRAPPER --- */
        .card-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px; /* Provides spacing clearance for 1.14x scaling on hover */
            perspective: 1500px;
            width: 100%;
        }

        .neon-border-wrapper {
            position: relative;
            width: 278px;
            height: 398px;
            background: linear-gradient(135deg, var(--neon-start) 0%, var(--neon-mid) 50%, var(--neon-end) 100%);
            background-size: 200% 200%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: neonPulse 4s linear infinite;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        .fut-card {
            position: relative;
            width: 272px;
            height: 392px;
            display: flex;
            flex-direction: column;
            padding: 3px;
            box-sizing: border-box;
            z-index: 2;
            transform: translateZ(35px);
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        @keyframes neonPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0,0,0,0.35) 0%, transparent 55%), conic-gradient(from 145deg at 75% 25%, #cfa81f 0deg, #ffd952 50deg, #594202 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #b59210 0deg, #402e01 80deg, #ffeba3 140deg, transparent 220deg), conic-gradient(from 55deg at 85% 50%, #9e7a0d 0deg, #fff085 60deg, #302200 140deg, transparent 200deg), conic-gradient(from 290deg at 20% 30%, #302200 0deg, #ebd05b 70deg, #876707 150deg, transparent 230deg), linear-gradient(to bottom, #ffe875 0%, #fced4e 45%, #695105 55%, #382501 100%);
            background-blend-mode: overlay, normal, multiply, overlay, soft-light, normal, normal;
            background-size: 100% 100%;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
            display: flex;
            flex-direction: column;
            padding: 24px 12px 15px 12px;
            box-sizing: border-box;
            z-index: 2;
        }

        .card-inner::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 248, 194, 0.7) 48%, transparent 56%);
            background-size: 280% 280%;
            background-position: var(--gloss-x, 170%) var(--gloss-y, 170%);
            mix-blend-mode: color-dodge;
            z-index: 3;
            pointer-events: none;
            transition: background-position 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-top {
            display: flex;
            height: 135px;
            width: 100%;
            margin-top: 5px;
            position: relative;
            z-index: 4;
        }

        .badge-ovr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 25%;
            gap: 2px;
            padding-top: 5px;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 4;
        }

        .ovr-txt {
            font-size: 46px;
            font-weight: 900;
            line-height: 38px;
            letter-spacing: -2px;
            color: #050401;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        }

        .pos-txt { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #050401; }
        .club-icon { width: 20px; height: 20px; opacity: 0.85; margin-top: 2px; }

        .avatar-placeholder {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 4;
            height: 100%;
        }

        .avatar-placeholder svg, .avatar-placeholder img {
            width: 90%;
            height: auto;
            max-height: 115px;
            object-fit: contain;
            object-position: center center;
        }

        .name-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 92%;                       
            margin: 15px auto 0 auto;
            padding: 4px 0;
            z-index: 4;
            background-color: var(--stat-panel-bg); 
            border: 2px solid var(--stat-box-border); 
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .player-name {
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
            margin: 0;
            padding: 3px 10px;
            color: #ffffff; 
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.95); 
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;       
            width: 92%;               
            margin: 14px auto 0 auto;
            z-index: 4; 
            background-color: var(--stat-panel-bg);
            border-radius: 8px;
            border: 2px solid var(--stat-box-border); 
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }

        .stat-column { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .stat-item { display: flex; align-items: center; justify-content: flex-start; gap: 10px; line-height: 1.1; width: 100%; }
        .stat-val { font-size: 22px; font-weight: 900; color: #fff; width: 32px; text-align: left; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stat-label { font-size: 15px; font-weight: 800; color: #ffd84a; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stats-vertical-divider { width: 2px; height: 68px; background-color: var(--stat-box-border); opacity: 0.75; margin: 0 8px; border-radius: 1px; }
    </style>

        <script>
            const wrapper = document.querySelector('.neon-border-wrapper');
            const inner = document.querySelector('.card-inner');
            if (wrapper && inner) {
                wrapper.addEventListener('mousemove', (e) => {
                    const rect = wrapper.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const rx = ((y / rect.height) - 0.5) * -28;
                    const ry = ((x / rect.width) - 0.5) * 28;
                    wrapper.style.transform = 'scale(1.14) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
                    inner.style.setProperty('--gloss-x', (100 - (x / rect.width) * 100) + '%');
                    inner.style.setProperty('--gloss-y', (100 - (y / rect.height) * 100) + '%');
                });
                wrapper.addEventListener('mouseleave', () => {
                    wrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
                    inner.style.setProperty('--gloss-x', '170%');
                    inner.style.setProperty('--gloss-y', '170%');
                });
            }
        </script></body></html>
    <div class="card-container" id="mainCardContainer">
        
    </div>

    <script>
        // Core mouse effect tracking engine
        function attachTiltEffect(wrapper) {
            // Prevent double-binding listeners
            if (wrapper.dataset.tiltBound === "true") return;
            wrapper.dataset.tiltBound = "true";

            const inner = wrapper.querySelector('.card-inner');
            if (!inner) return;

            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const rx = ((y / rect.height) - 0.5) * -28;
                const ry = ((x / rect.width) - 0.5) * 28;
                wrapper.style.transform = 'scale(1.14) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
                inner.style.setProperty('--gloss-x', (100 - (x / rect.width) * 100) + '%');
                inner.style.setProperty('--gloss-y', (100 - (y / rect.height) * 100) + '%');
            });

            wrapper.addEventListener('mouseleave', () => {
                wrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
                inner.style.setProperty('--gloss-x', '170%');
                inner.style.setProperty('--gloss-y', '170%');
            });
        }

        // Auto-detect engine watches the container for newly pasted cards
        const containerNode = document.getElementById('mainCardContainer');
        const layoutObserver = new MutationObserver((mutations) => {
            containerNode.querySelectorAll('.neon-border-wrapper').forEach(attachTiltEffect);
        });

        layoutObserver.observe(containerNode, { childList: true, subtree: true });
    </script>
