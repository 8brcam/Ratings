<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style id="themeStylesheet">
        :root {
            --bg-color: #02040a;
            --panel-bg: #0b0f19;
            --text-color: #f8fafc;
            --card-text: #050401;
            --stat-box-border: #946f02;
            --stat-panel-bg: rgba(30, 20, 1, 0.75);
            /* Dynamic neon border colors */
            --neon-start: #00f0ff;
            --neon-mid: #0066ff;
            --neon-end: #00f0ff;
        }

        body {
            font-family: "Arial Black", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            background-color: var(--panel-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 900px;
            width: auto;
            transition: all 0.3s ease;
        }
        /* --- THE EVEN SHIELD ARCHITECTURE --- */
        .card-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        .neon-border-wrapper {
            position: relative;
            width: 278px;
            height: 398px;
            background: linear-gradient(135deg, var(--neon-start) 0%, var(--neon-mid) 50%, var(--neon-end) 100%);
            background-size: 200% 200%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: neonPulse 4s linear infinite;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        .neon-border-wrapper:hover {
            transform: scale(1.14) rotateX(10deg) rotateY(-5deg);
            box-shadow: 0 30px 70px rgba(0, 229, 255, 0.35), 0 15px 30px rgba(0, 102, 255, 0.25);
        }

        .fut-card {
            position: relative;
            width: 272px;
            height: 392px;
            display: flex;
            flex-direction: column;
            padding: 3px;
            box-sizing: border-box;
            z-index: 2;
            transform: translateZ(35px);
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        @keyframes neonPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0,0,0,0.35) 0%, transparent 55%), conic-gradient(from 145deg at 75% 25%, #cfa81f 0deg, #ffd952 50deg, #594202 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #b59210 0deg, #402e01 80deg, #ffeba3 140deg, transparent 220deg), conic-gradient(from 55deg at 85% 50%, #9e7a0d 0deg, #fff085 60deg, #302200 140deg, transparent 200deg), conic-gradient(from 290deg at 20% 30%, #302200 0deg, #ebd05b 70deg, #876707 150deg, transparent 230deg), linear-gradient(to bottom, #ffe875 0%, #fced4e 45%, #695105 55%, #382501 100%);
            background-blend-mode: overlay, normal, multiply, overlay, soft-light, normal, normal;
            background-size: 100% 100%;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
            display: flex;
            flex-direction: column;
            padding: 24px 12px 15px 12px;
            box-sizing: border-box;
            z-index: 2;
        }

        .card-inner::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 248, 194, 0.7) 48%, transparent 56%);
            background-size: 280% 280%;
            background-position: var(--gloss-x, 170%) var(--gloss-y, 170%);
            mix-blend-mode: color-dodge;
            z-index: 3;
            pointer-events: none;
            transition: background-position 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-top {
            display: flex;
            height: 135px;
            width: 100%;
            margin-top: 5px;
            position: relative;
            z-index: 4;
        }
        .badge-ovr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 25%;
            gap: 2px;
            padding-top: 5px;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 4;
        }

        .ovr-txt {
            font-size: 46px;
            font-weight: 900;
            line-height: 38px;
            letter-spacing: -2px;
            color: #050401;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        }

        .pos-txt { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #050401; }
        .club-icon { width: 20px; height: 20px; opacity: 0.85; margin-top: 2px; }

        .avatar-placeholder {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            z-index: 4;
            height: 100%;
        }

        .avatar-placeholder svg, .avatar-placeholder img {
            width: 90%;
            height: auto;
            max-height: 115px;
            object-fit: contain;
            object-position: bottom center;
        }

        .name-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 92%;                       
            margin: 0 auto;                  
            padding: 4px 0;
            z-index: 4;
            background-color: var(--stat-panel-bg); 
            border: 2px solid var(--stat-box-border); 
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .player-name {
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
            margin: 0;
            padding: 3px 10px;
            color: #ffffff; /* Symmetrical crisp white font selection */
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.95); /* Deep high-definition background drop shadow */
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;       
            width: 92%;               
            margin: 10px auto 0 auto; 
            z-index: 4; 
            background-color: var(--stat-panel-bg);
            border-radius: 8px;
            border: 2px solid var(--stat-box-border); 
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }

        .stat-column {
            display: flex;
            flex-direction: column;
            gap: 3px;                 
            flex: 1;
        }

        .stat-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;                
            line-height: 1.1;
            width: 100%;
        }

        .stat-val { 
            font-size: 22px;          
            font-weight: 900; 
            color: #fff; 
            width: 32px;
            text-align: left;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .stat-label {
            font-size: 15px;          
            font-weight: 800;
            color: #ffd84a; 
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .stats-vertical-divider {
            width: 2px;
            height: 68px;             
            background-color: var(--stat-box-border);
            opacity: 0.75;
            margin: 0 8px;
            border-radius: 1px;
        }

        /* --- CONTROL PANEL SIDEBAR --- */
        .controls-panel { display: flex; flex-direction: column; gap: 14px; width: 320px; border-left: 1px solid #374151; padding-left: 30px; max-height: 90vh; overflow-y: auto; }
        h2 { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin-top: 0; font-size: 24px; border-bottom: 1px solid #475569; padding-bottom: 8px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; color: #94a3b8; }
        input[type="text"], select, textarea { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 15px; outline: none; }
        .btn-upload { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
        .slider-row { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: #dca021; cursor: pointer; }
        .slider-val { width: 30px; text-align: right; font-weight: 700; font-size: 15px; }

        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            .controls-panel { width: 100%; border-left: none; border-top: 1px solid #374151; padding-left: 0; padding-top: 20px; }
        }
    </style></head><body style="background:#02040a; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;">
        <div class="neon-border-wrapper" id="glowWrapper" style="transform: scale(1) rotateX(0deg) rotateY(0deg);">
            <div class="fut-card" id="cardElement">
                <div class="card-inner" id="cardInnerLayer" style="background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0, 0, 0, 0.3) 0%, transparent 55%), conic-gradient(from 145deg at 75% 25%, rgb(207, 168, 31) 0deg, rgb(255, 217, 82) 50deg, rgb(89, 66, 2) 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, rgb(181, 146, 16) 0deg, rgb(64, 46, 1) 80deg, rgb(255, 235, 163) 140deg, transparent 220deg), linear-gradient(rgb(255, 232, 117) 0%, rgb(252, 237, 78) 45%, rgb(105, 81, 5) 55%, rgb(56, 37, 1) 100%); --gloss-x: 170%; --gloss-y: 170%;">
                    <div class="card-top">
                        <div class="badge-ovr">
                            <span class="ovr-txt" id="cardOvr">85</span>
                            <span class="pos-txt" id="cardPos">CUE</span>
                            <!-- Clean native unicode vector flag container independent of cross-origin network hosts -->
                            <span id="cardFlag" style="font-size: 22px; line-height: 1; margin: 4px 0; display: inline-block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));">🇵🇹</span>
                            <svg class="club-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                                <circle cx="50" cy="50" r="45" fill="#000"></circle><circle cx="50" cy="50" r="20" fill="#fff"></circle>
                            </svg>
                        </div>
                        <div class="avatar-placeholder" id="avatarPlaceholder">
                            <svg id="defaultSilhouette" viewBox="0 0 100 100" xmlns="http://w3.org">
                                <path d="M50,90 C30,90 20,75 20,60 C20,40 30,20 50,20 C70,20 80,40 80,60 C80,75 70,90 50,90 Z" fill="#000" opacity="0.25"></path>
                                <circle cx="50" cy="40" r="18" fill="#000" opacity="0.25"></circle>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="name-box">
                        <div class="player-name" id="cardName">Player Name</div>
                    </div>
                    
                    <div class="stats-grid" id="statsGridElement">
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val" id="cardAgg">85</span><span class="stat-label">AGG</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardCtr">85</span><span class="stat-label">CTR</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardSel">85</span><span class="stat-label">SEL</span></div>
                        </div>
                        <div class="stats-vertical-divider"></div>
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val" id="cardPot">85</span><span class="stat-label">POT</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardSaf">85</span><span class="stat-label">SAF</span></div>
                            <div class="stat-item"><span class="stat-val" id="cardTem">85</span><span class="stat-label">TEM</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body></html>
