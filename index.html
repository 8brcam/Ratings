<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ultimate Team Component Matrix</title>
    <style id="themeStylesheet">
        :root {
            --bg-color: #02040a;
            --panel-bg: #0b0f19;
            --text-color: #f8fafc;
            --card-text: #050401;
            --stat-box-border: #946f02;
            --stat-panel-bg: rgba(30, 20, 1, 0.75);
            /* Dynamic neon border colors */
            --neon-start: #00f0ff;
            --neon-mid: #0066ff;
            --neon-end: #00f0ff;
        }

        body {
            font-family: "Arial Black", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* --- DUAL SIDE-BY-SIDE FLEX CONTAINER LAYER --- */
        .card-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 60px; /* Space between cards so they do not clip during 1.14x hover scaling */
            perspective: 1500px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .neon-border-wrapper {
            position: relative;
            width: 278px;
            height: 398px;
            background: linear-gradient(135deg, var(--neon-start) 0%, var(--neon-mid) 50%, var(--neon-end) 100%);
            background-size: 200% 200%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: neonPulse 4s linear infinite;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        .fut-card {
            position: relative;
            width: 272px;
            height: 392px;
            display: flex;
            flex-direction: column;
            padding: 3px;
            box-sizing: border-box;
            z-index: 2;
            transform: translateZ(35px);
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
        }

        @keyframes neonPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background-blend-mode: overlay, normal, multiply, overlay, soft-light, normal, normal;
            background-size: 100% 100%;
            clip-path: polygon(0% 8%, 20% 0%, 50% 3%, 80% 0%, 100% 8%, 100% 88%, 50% 100%, 0% 88%);
            display: flex;
            flex-direction: column;
            padding: 24px 12px 15px 12px;
            box-sizing: border-box;
            z-index: 2;
        }
        /* PREMIUM GOLD CHROMATIC FACE MAP */
        .theme-gold {
            background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 45%), linear-gradient(225deg, rgba(0,0,0,0.35) 0%, transparent 55%), conic-gradient(from 145deg at 75% 25%, #cfa81f 0deg, #ffd952 50deg, #594202 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, #b59210 0deg, #402e01 80deg, #ffeba3 140deg, transparent 220deg), conic-gradient(from 55deg at 85% 50%, #9e7a0d 0deg, #fff085 60deg, #302200 140deg, transparent 200deg), conic-gradient(from 290deg at 20% 30%, #302200 0deg, #ebd05b 70deg, #876707 150deg, transparent 230deg), linear-gradient(to bottom, #ffe875 0%, #fced4e 45%, #695105 55%, #382501 100%);
        }

        /* PREMIUM SILVER CHROMATIC FACE MAP */
        .theme-silver {
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, transparent 45%), linear-gradient(225deg, rgba(0, 0, 0, 0.2) 0%, transparent 55%), conic-gradient(from 145deg at 75% 25%, rgb(148, 163, 184) 0deg, rgb(255, 255, 255) 50deg, rgb(71, 85, 105) 120deg, transparent 190deg), conic-gradient(from 215deg at 35% 65%, rgb(203, 213, 225) 0deg, rgb(30, 41, 59) 80deg, rgb(248, 250, 252) 140deg, transparent 220deg), linear-gradient(rgb(241, 245, 249) 0%, rgb(203, 213, 225) 45%, rgb(51, 65, 85) 55%, rgb(15, 23, 42) 100%);
        }

        .card-inner::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 248, 194, 0.7) 48%, transparent 56%);
            background-size: 280% 280%;
            background-position: var(--gloss-x, 170%) var(--gloss-y, 170%);
            mix-blend-mode: color-dodge;
            z-index: 3;
            pointer-events: none;
            transition: background-position 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-top {
            display: flex;
            height: 135px;
            width: 100%;
            margin-top: 5px;
            position: relative;
            z-index: 4;
        }

        .badge-ovr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 25%;
            gap: 2px;
            padding-top: 5px;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 4;
        }

        .ovr-txt {
            font-size: 46px;
            font-weight: 900;
            line-height: 38px;
            letter-spacing: -2px;
            color: #050401;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        }

        .pos-txt { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #050401; }
        .club-icon { width: 20px; height: 20px; opacity: 0.85; margin-top: 2px; }

        .avatar-placeholder {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 4;
            height: 100%;
        }

        .avatar-placeholder svg, .avatar-placeholder img {
            width: 90%;
            height: auto;
            max-height: 115px;
            object-fit: contain;
            object-position: center center;
        }

        .name-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 92%;                       
            margin: 15px auto 0 auto;
            padding: 4px 0;
            z-index: 4;
            background-color: var(--stat-panel-bg); 
            border: 2px solid var(--stat-box-border); 
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .player-name {
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
            margin: 0;
            padding: 3px 10px;
            color: #ffffff; 
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.95); 
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;       
            width: 92%;               
            margin: 14px auto 0 auto;
            z-index: 4; 
            background-color: var(--stat-panel-bg);
            border-radius: 8px;
            border: 2px solid var(--stat-box-border); 
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }

        .stat-column { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .stat-item { display: flex; align-items: center; justify-content: flex-start; gap: 10px; line-height: 1.1; width: 100%; }
        .stat-val { font-size: 22px; font-weight: 900; color: #fff; width: 32px; text-align: left; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stat-label { font-size: 15px; font-weight: 800; color: #ffd84a; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stats-vertical-divider { width: 2px; height: 68px; background-color: var(--stat-box-border); opacity: 0.75; margin: 0 8px; border-radius: 1px; }
    </style>
</head>
<body>
    <div class="card-container">
        
        <!-- CARD 1 MODULE ARCHITECTURE: GOLD ITEM -->
        <div class="neon-border-wrapper">
            <div class="fut-card">
                <div class="card-inner theme-gold" style="--gloss-x: 170%; --gloss-y: 170%;">
                    
                    <div class="card-top">
                        <div class="badge-ovr">
                            <span class="ovr-txt">85</span>
                            <span class="pos-txt">CUE</span>
                            <span style="font-size: 22px; line-height: 1; margin: 4px 0; display: inline-block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));">🇵🇹</span>
                            <svg class="club-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                                <circle cx="50" cy="50" r="45" fill="#000"></circle><circle cx="50" cy="50" r="20" fill="#fff"></circle>
                            </svg>
                        </div>
                        <div class="avatar-placeholder">
                            <img src="https://nocookie.net" alt="Gold Display Model">
                        </div>
                    </div>

                    <div class="name-box">
                        <h2 class="player-name">GOLD ITEM</h2>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val">88</span><span class="stat-label">PAC</span></div>
                            <div class="stat-item"><span class="stat-val">84</span><span class="stat-label">SHO</span></div>
                            <div class="stat-item"><span class="stat-val">81</span><span class="stat-label">PAS</span></div>
                        </div>
                        <div class="stats-vertical-divider"></div>
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val">87</span><span class="stat-label">DRI</span></div>
                            <div class="stat-item"><span class="stat-val">42</span><span class="stat-label">DEF</span></div>
                            <div class="stat-item"><span class="stat-val">79</span><span class="stat-label">PHY</span></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!-- CARD 2 MODULE ARCHITECTURE: SILVER HERO -->
        <div class="neon-border-wrapper">
            <div class="fut-card">
                <div class="card-inner theme-silver" style="--gloss-x: 170%; --gloss-y: 170%;">
                    
                    <div class="card-top">
                        <div class="badge-ovr">
                            <span class="ovr-txt">71</span>
                            <span class="pos-txt">CUE</span>
                            <span style="font-size: 22px; line-height: 1; margin: 4px 0; display: inline-block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));">🇺🇸</span>
                            <svg class="club-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                                <circle cx="50" cy="50" r="45" fill="#000"></circle><circle cx="50" cy="50" r="20" fill="#fff"></circle>
                            </svg>
                        </div>
                        <div class="avatar-placeholder">
                            <img src="https://nocookie.net" alt="Silver Display Model">
                        </div>
                    </div>

                    <div class="name-box">
                        <h2 class="player-name">SILVER HERO</h2>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val">75</span><span class="stat-label">PAC</span></div>
                            <div class="stat-item"><span class="stat-val">70</span><span class="stat-label">SHO</span></div>
                            <div class="stat-item"><span class="stat-val">82</span><span class="stat-label">PAS</span></div>
                        </div>
                        <div class="stats-vertical-divider"></div>
                        <div class="stat-column">
                            <div class="stat-item"><span class="stat-val">80</span><span class="stat-label">DRI</span></div>
                            <div class="stat-item"><span class="stat-val">68</span><span class="stat-label">DEF</span></div>
                            <div class="stat-item"><span class="stat-val">74</span><span class="stat-label">PHY</span></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
    <script>
        // Updated selector parses all target nodes into an iterable array collection
        const wrappers = document.querySelectorAll('.neon-border-wrapper');
        
        // Loop binds unique tracker loops inside each individual component scope
        wrappers.forEach(wrapper => {
            const inner = wrapper.querySelector('.card-inner');
            if (wrapper && inner) {
                wrapper.addEventListener('mousemove', (e) => {
                    const rect = wrapper.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    // Retaining your exact arithmetic vector formulas
                    const rx = ((y / rect.height) - 0.5) * -28;
                    const ry = ((x / rect.width) - 0.5) * 28;
                    
                    wrapper.style.transform = 'scale(1.14) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
                    inner.style.setProperty('--gloss-x', (100 - (x / rect.width) * 100) + '%');
                    inner.style.setProperty('--gloss-y', (100 - (y / rect.height) * 100) + '%');
                });
                
                wrapper.addEventListener('mouseleave', () => {
                    wrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
                    inner.style.setProperty('--gloss-x', '170%');
                    inner.style.setProperty('--gloss-y', '170%');
                });
            }
        });
    </script>
</body>
</html>
