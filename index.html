                            inner.style.setProperty('--gloss-y', (100 - (e.clientY - r.top) / r.height * 100) + '%');
                        });
                        wrapper.addEventListener('mouseleave', () => {
                            wrapper.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
                            inner.style.setProperty('--gloss-x', '170%');
                            inner.style.setProperty('--gloss-y', '170%');
                        });
                    }
                };
                window.addEventListener('DOMContentLoaded', () => mapTrackingLoop('j7dy4'));
                window.cueverseBinder = mapTrackingLoop;
            })();
        </script></body></html>
